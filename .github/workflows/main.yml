name: Build Windows EXE and installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build EXEs
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --collect-all anthropic --icon icon.ico --name golem-core agent.py
          pyinstaller --noconfirm --onefile --windowed --icon icon.ico --name Golem agent_gui.py
          pyinstaller --noconfirm --onefile --windowed --icon icon.ico --name Golem-Builder builder.py
          ls -la dist

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          Write-Output "ISCC=$iscc"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc golem.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Golem-Windows-Build
          path: |
            dist/*.exe
            installer/*.exe
          if-no-files-found: error
